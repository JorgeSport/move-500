name: Cerrar oferta
on:
  schedule:
    - cron: '0 5 27 9 *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/expire_offer.py
      - name: Guardar estado final
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Close September 2026 offer'
            git push
          fi
      - name: Publicar cierre en GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/${{ github.repository }}/pages/builds
